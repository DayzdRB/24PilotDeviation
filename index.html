<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1118" />
  <meta name="description" content="24Pilot Deviation — unofficial Possible Pilot Deviation reporting for the ATC24 community." />
  <title>24Pilot Deviation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="24Pilot Deviation home">
        <span class="brand-mark">24</span>
        <span><strong>24Pilot Deviation</strong><small>ATC24 Pilot Deviation Reporting</small></span>
      </a>
      <button class="mobile-menu" id="mobile-menu" aria-label="Open navigation" aria-expanded="false">☰</button>
      <nav id="nav" class="nav-links" aria-label="Primary">
        <a href="#home" data-route="home">Home</a>
        <a href="#aircraft" data-route="aircraft">Live Aircraft</a>
        <a href="#file" data-route="file">File PPD</a>
        <a href="#respond" data-route="respond">Respond</a>
        <a href="#reports" data-route="reports">Public Reports</a>
      </nav>
      <div class="system-status" id="system-status">
        <span class="status-dot connecting"></span>
        <span><strong id="data-status">CONNECTING</strong><small id="last-update">24Data</small></span>
      </div>
    </header>

    <main id="app" class="main-content" tabindex="-1"></main>

    <footer class="footer">
      <span>24Pilot Deviation</span>
      <span>Unofficial community project — not affiliated with or operated by the FAA, Roblox, PTFS, or ATC24.</span>
    </footer>
  </div>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="/js/app.js" defer></script>
</body>
</html>
